version: '3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: katrin7828/kittygram_backend:latest
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "python manage.py collectstatic --noinput &&
            gunicorn --bind 0.0.0.0:8000 kittygram_backend.wsgi"
    volumes:
      - static:/backend_static
      - media:/app/media
    depends_on:
      - db

  frontend:
    image: katrin7828/kittygram_frontend:latest
    env_file: .env
    command: cp -r /app/build/. /static/
    volumes:
      - static:/static

  gateway:
    image: katrin7828/kittygram_gateway:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:9000:80"
    volumes:
      - static:/static
      - media:/media
    depends_on:
      - backend